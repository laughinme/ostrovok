# Single origin on :8080 (organizers' rule): the app at /, the API, docs and MCP at /api and /mcp.
# Refresh Docker DNS after a service is recreated (for example, when LLM settings change).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
}
upstream frontend {
    zone frontend 64k;
    server frontend:3000 resolve;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://backend/health;
    }

    # Server-sent events: agent steps must reach the browser without buffering.
    location ~ ^/api/v1/(runs/[^/]+/events|events|me/notifications/stream) {
        proxy_pass http://backend;
        # A location with its own proxy_set_header inherits none from the server block.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_read_timeout 120s;
    }

    location /mcp {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
