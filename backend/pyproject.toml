[project]
name = "okno-backend"
version = "0.1.0"
description = "О!кно: hotel knowledge layer with agents (Ostrovok Hackathon 2026, team chupapis)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.41",
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "geoalchemy2>=0.18",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "email-validator>=2.3",
    "pyjwt[crypto]>=2.11",
    "argon2-cffi>=25.1",
    "redis>=7.3",
    "httpx>=0.28",
    "numpy>=2.3",
    "scipy>=1.16",
    "shapely>=2.1",
    "pyyaml>=6.0",
    "astral>=3.2",
    "rapidfuzz>=3.14",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "hypothesis>=6.140",
    "ruff>=0.14",
    "mypy>=1.18",
    "import-linter>=2.5",
    "types-pyyaml>=6.0",
    "scipy-stubs>=1.16",
]
# Offline data preparation only (`make data`); never installed into the runtime image.
pipeline = [
    "osmnx>=2.0",
    "geopandas>=1.1",
    "rasterio>=1.4",
    "pyogrio>=0.11",
    "pyproj>=3.7",
    "matplotlib>=3.10",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions", "pipeline/spikes"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PIE", "PT", "RET",
    "SIM", "ARG", "ERA", "PL", "RUF", "S", "ASYNC", "TID", "PERF", "FAST",
]
ignore = [
    "PLR0913",  # services and factories take many keyword-only arguments on purpose
    "RUF001",   # Cyrillic text is user-facing copy, not a confusable
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Fakes implement protocols, so they keep parameters they do not use.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002"]
# FastAPI calls endpoints with keyword arguments; many parameters is how DI looks there.
"app/api/**" = ["PLR0917"]
# Offline scripts print progress and talk to known public hosts.
"pipeline/**" = ["T201", "S310", "PLR2004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body",
    "fastapi.Cookie",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations/env.py"]

[[tool.mypy.overrides]]
module = ["shapely.*", "astral.*", "geoalchemy2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: needs PostGIS and Redis from docker-compose.test.yml"]
filterwarnings = ["error::DeprecationWarning:app.*"]
