snapshot_at: '2026-10-28T06:20:52.389039+00:00'
methodology:
  label: Оценки команды по фактам расчёта; автоматически по зафиксированной рубрике
  kind: fact_based_regression
  independent_gold: false
  rubric: 'В одной точке фасад×этаж×месяц: 3=все условия, 2=не менее половины, 1=хотя
    бы одно, 0=нет подтверждения или превышен бюджет. P(да)≥0,65. Неизвестное не подтверждает
    условие.'
  pool: До 12 отелей с фактами по OSM ID в районе из R2. nDCG считается только внутри
    этого фиксированного пула; IDCG=0 исключается, количество исключений выводится.
  limits: Без фотографий. Это согласованность выдачи с расчётами, не независимая оценка
    реальности. Не все оснащение и неизвестные пожелания подтверждены; метки не обновляются
    при eval.
  reproduce: uv run python -m pipeline.quality_search (явно перезаписывает разметку
    текущими фактами)
