  coverage_note: "low — обычно указан лишь fast_food, конкретное блюдо часто не размечено."
  uncertain: true

шашлычная:
  osm:
    - {amenity: [restaurant, cafe, fast_food], name: "*"}
  name_regex: '(?i)шашлы|shashlik|шашлик'
  coverage_note: "low — cuisine=barbecue не равен шашлычной, надёжнее искать название."
  uncertain: true

кофейня:
