# Словарь: 150 видов мест для гостей отелей Большого Сочи.
#
# osm: ИЛИ между элементами списка, И между тегами внутри элемента.
# "*" означает наличие тега, [a, b] — любое из указанных значений.
# Альтернативы с name: "*" — кандидаты, требующие проверки name_regex.
# Остальные альтернативы работают самостоятельно по тегам.
# name_regex проверяется по name, alt_name, official_name,
# short_name и brand при их наличии.
# Значения OSM, разделённые ";", следует разбивать при сопоставлении.
#
# coverage_note — качественная оценка для России:
# high — обычно хорошо размечено;
# medium — заметные пробелы;
# low — редкая или непоследовательная разметка.
# Это экспертная оценка, не статистический замер покрытия Сочи.
#
# Для условий «у моря», «рядом с пляжем» и похожих
# необходим отдельный пространственный фильтр.
# opening_hours необходимо проверять на актуальность.
#
# Источники: OSM Wiki
# https://wiki.openstreetmap.org/wiki/Key:amenity
# https://wiki.openstreetmap.org/wiki/Shop
# https://wiki.openstreetmap.org/wiki/Key:leisure
# https://wiki.openstreetmap.org/wiki/Key:tourism
# https://wiki.openstreetmap.org/wiki/Key:healthcare
# https://wiki.openstreetmap.org/wiki/Key:healthcare:speciality
# https://wiki.openstreetmap.org/wiki/Key:cuisine
# https://wiki.openstreetmap.org/wiki/Key:opening_hours
# https://wiki.openstreetmap.org/wiki/Public_transport
# https://wiki.openstreetmap.org/wiki/Key:aerialway
# https://wiki.openstreetmap.org/wiki/Spa
# https://wiki.openstreetmap.org/wiki/Pistes

# ============================================
# ЕДА И НОЧНАЯ ЖИЗНЬ — 31
# ============================================

хинкальная:
  osm:
    - {amenity: restaurant, name: "*"}
    - {amenity: cafe, name: "*"}
    - {amenity: fast_food, name: "*"}
  name_regex: '(?i)хинкал|khinkal'
  coverage_note: "low — отдельного устойчивого тега для хинкальных нет, помогают названия."
  uncertain: true

грузинская кухня:
  osm:
    - {amenity: [restaurant, cafe], cuisine: georgian}
    - {amenity: [restaurant, cafe], name: "*"}
  name_regex: '(?i)грузин|хачапур|сакартвел|тбилис|georgian'
  coverage_note: "medium — тип кухни размечают не везде, названия помогают частично."
  uncertain: true

шаурмичная:
  osm:
    - {amenity: fast_food, name: "*"}
    - {amenity: cafe, name: "*"}
