    - {amenity: cafe, cuisine: coffee_shop}
    - {amenity: cafe, name: "*"}
  name_regex: '(?i)кофейн|кофе|coffee|coffe|эспрессо'
  coverage_note: "medium — кафе нанесены широко, но подтип coffee_shop часто пропущен."
  uncertain: true

пекарня:
