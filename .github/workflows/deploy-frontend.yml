name: Deploy frontend-3 to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'frontend-3/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-3/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Pull Vercel project settings
        run: npx --yes vercel@53.2.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build for Vercel
        run: npx --yes vercel@53.2.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: npx --yes vercel@53.2.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
