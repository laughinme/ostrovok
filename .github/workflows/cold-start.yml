name: Cold start on amd64

# The organizers' run on a clean x86 machine: clone → cp .env.example .env → docker compose up --build
# → http://localhost:8080 within 10 minutes, with no LLM key. Started by hand before submission.
on:
  workflow_dispatch:

jobs:
  cold-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env from the example
        run: cp .env.example .env
      - name: Build and start, timed
        run: |
          started=$(date +%s)
          docker compose up --build -d
          until curl -fsS http://localhost:8080/health >/dev/null 2>&1; do
            if (( $(date +%s) - started > 600 )); then echo "not healthy after 10 minutes"; exit 1; fi
            sleep 5
          done
          echo "healthy after $(( $(date +%s) - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test through the gateway
        run: |
          pip install --quiet httpx==0.28.1
          started=$(date +%s)
          python backend/tests/smoke.py http://localhost:8080
          echo "smoke passed in $(( $(date +%s) - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Services and errors in the logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color > compose.log
          grep -iE "error|traceback" compose.log | grep -viE "error_code|errors?\.py|level=info" | head -50 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-log
          path: compose.log
