name: Deploy backend to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/fly/okno-api.fly.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      # Builds backend/Dockerfile remotely, runs `python -m app.init` (migrations + seed) as the
      # release command, then replaces the app and worker machines once /health passes.
      - name: Deploy okno-api
        run: flyctl deploy backend --config "$GITHUB_WORKSPACE/deploy/fly/okno-api.fly.toml" --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
