# Словарь «как гость называет место → фильтр тегов OpenStreetMap» для Большого Сочи.
# Полная версия: 150 видов мест из предыдущего ответа.
#
# Формат каждого элемента:
#   osm: список альтернативных наборов тегов (между элементами списка — ИЛИ);
#        внутри одного набора теги объединены через И;
#        значению [a, b] соответствует a ИЛИ b;
#        "*" означает наличие ключа с любым значением.
#   name_regex: если не null, ОБЯЗАТЕЛЬНОЕ дополнительное условие к osm.
#               Проверять name, name:ru, name:en, official_name, short_name,
#               alt_name без учёта регистра, с нормализацией ё→е.
#   coverage_note: high/medium/low и пояснение — экспертная качественная оценка
#                  ожидаемой полноты в России, НЕ измеренная статистика OSM.
#   uncertain: true — только приблизительное соответствие, требуется проверка.
#              Низкая полнота покрытия сама по себе не делает маппинг неверным.
#
# Для cuisine, sport, healthcare:speciality, outdoor_seating, beauty,
# theatre:genre и rental значения могут быть разделены «;»; при сопоставлении
# следует разделять такие значения и обрезать пробелы.
# opening_hours имеет отдельный синтаксис (согласно OSM Wiki): строгое
# opening_hours: "24/7" НЕ охватывает все эквивалентные круглосуточные графики.
#
# Границы Большого Сочи и радиус поиска задаются вне данного словаря.
# Для расстояний до больших объектов следует использовать доступный вход;
# доступ, часы работы и сезонность проверяются отдельно. name_regex НЕ
# доказывает соответствие услуги без подтверждения первичных данных.
#
# Первичные справочники по тегам OSM Wiki (из предыдущего ответа):
# https://wiki.openstreetmap.org/wiki/Key:amenity
# https://wiki.openstreetmap.org/wiki/Key:cuisine
# https://wiki.openstreetmap.org/wiki/Key:diet
# https://wiki.openstreetmap.org/wiki/Key:outdoor_seating
# https://wiki.openstreetmap.org/wiki/Key:karaoke
# https://wiki.openstreetmap.org/wiki/Key:shop
# https://wiki.openstreetmap.org/wiki/Template:RU:Map_Features:shop
# https://wiki.openstreetmap.org/wiki/Tag:rental=ski
# https://wiki.openstreetmap.org/wiki/Tag:amenity=ski_rental
# https://wiki.openstreetmap.org/wiki/Key:healthcare
# https://wiki.openstreetmap.org/wiki/Key:healthcare:speciality
# https://wiki.openstreetmap.org/wiki/Tag:healthcare=sample_collection
# https://wiki.openstreetmap.org/wiki/Key:leisure
# https://wiki.openstreetmap.org/wiki/Key:tourism
# https://wiki.openstreetmap.org/wiki/Tag:tourism=aquarium
# https://wiki.openstreetmap.org/wiki/Tag:amenity=theatre
# https://wiki.openstreetmap.org/wiki/Tag:railway=station
# https://wiki.openstreetmap.org/wiki/Key:aerialway
# https://wiki.openstreetmap.org/wiki/Tag:amenity=parking
# https://wiki.openstreetmap.org/wiki/Tag:amenity=charging_station
# https://wiki.openstreetmap.org/wiki/Tag:natural=beach
# https://wiki.openstreetmap.org/wiki/Tag:surface=pebblestone
# https://wiki.openstreetmap.org/wiki/Tag:garden:type=botanical
# https://wiki.openstreetmap.org/wiki/Tag:route=hiking
# https://wiki.openstreetmap.org/wiki/Key:sport
# https://wiki.openstreetmap.org/wiki/Tag:leisure=swimming_pool
# https://wiki.openstreetmap.org/wiki/Spa
# https://wiki.openstreetmap.org/wiki/Tag:amenity=public_bath
# https://wiki.openstreetmap.org/wiki/Tag:amenity=concert_hall
# https://wiki.openstreetmap.org/wiki/Tag:amenity=luggage_locker
# https://wiki.openstreetmap.org/wiki/Tag:amenity=left_luggage
# https://wiki.openstreetmap.org/wiki/Tag:information=office
